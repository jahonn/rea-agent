name: Bug report
description: Report a reproducible problem using non-confidential fixtures
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use a synthetic or owned fixture. Do not attach proprietary targets or confidential output.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js version, agent host, and rea-agent version.
    validations:
      required: true
